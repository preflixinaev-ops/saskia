<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saskia, Maaf ganggu... — Ini Sebuah Catatan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap');

:root{
  --bg:#fffafc; --ink:#29242a; --muted:#756873;
  --accent:#d889a6; --accent2:#f3dce5; --paper:#ffffffd9;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 15% 15%, #f8dce8 0 12%, transparent 32%),
    radial-gradient(circle at 85% 80%, #e7f0e7 0 10%, transparent 30%),
    linear-gradient(135deg,#fffafd,#fff 52%,#f8f1f5);
  color:var(--ink); font-family:"DM Sans",sans-serif;
}
#book{height:100%;display:flex;align-items:center;justify-content:center;padding:28px}
.page{
  width:min(900px,94vw); height:min(720px,88vh); position:relative;
  background:var(--paper); border:1px solid #eadfe5; border-radius:26px;
  box-shadow:0 24px 70px #a8899925, inset 0 0 0 1px #ffffff;
  padding:clamp(34px,6vw,78px); overflow:hidden;
  display:none; animation:in .55s ease both;
}
.page.active{display:flex;flex-direction:column;justify-content:center}
@keyframes in{from{opacity:0;transform:translateX(28px) scale(.985)}to{opacity:1;transform:none}}
.page:before{
  content:"";position:absolute;left:0;top:0;width:100%;height:5px;
  background:linear-gradient(90deg,#d889a6,#eab8ca,#a9c4ad,#d889a6);
}
.chapter{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
h1{font-family:"Cormorant Garamond",serif;font-size:clamp(42px,7vw,76px);font-weight:500;line-height:.95;margin:0 0 20px}
h2{font-family:"Cormorant Garamond",serif;font-size:clamp(30px,4vw,48px);font-weight:500;margin:0 0 20px}
.text{
  font-family:"Cormorant Garamond",serif;font-size:clamp(21px,2.25vw,27px);font-weight:500;
  line-height:1.65;max-width:760px;white-space:pre-line;
}
.cover .text{font-size:19px;color:var(--muted);font-family:"DM Sans",sans-serif}
.page-num{position:absolute;bottom:24px;right:34px;color:#ad9da8;font-size:12px}
.nav{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;align-items:center;z-index:10;
}
button{
  border:1px solid #e2d3dc;background:#ffffffd9;color:#604d59;
  width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;
  box-shadow:0 7px 22px #8e708020;backdrop-filter:blur(8px)
}
button:hover{transform:translateY(-1px);background:#fff}
#music{
  position:fixed;top:18px;right:18px;z-index:10;
  width:auto;padding:0 16px;border-radius:999px;font-size:12px;height:38px;
}
#hint{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);font-size:11px;color:#9b8994;opacity:.8}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 7px 2px}
@media(max-height:650px){.page{height:84vh;padding:30px 38px}.text{font-size:19px;line-height:1.55}}
</style>
</head>
<body>

<button id="music">♪ Nyalakan musik</button>
<div id="book"></div>
<div class="nav">
  <button id="prev" aria-label="Sebelumnya">‹</button>
  <span id="counter">1 / 1</span>
  <button id="next" aria-label="Berikutnya">›</button>
</div>
<div id="hint">klik kanan/kiri untuk berpindah halaman <span class="dot"></span> baca pelan pelan yaa</div>

<audio id="audio" loop preload="auto">
  <source src="ANJAYLAGU.mp3" type="audio/mpeg">
</audio>

<script>
const pages = [
{cover:true,title:"saskia, maaf ganggu...",sub:"ini sebuah catatan kecil yang ditulis dengan banyak hal yang mungkin sulit diucapkan langsung.",chapter:"01 · malam ini"},
`selamat malam, yayaa.

makasih banyak yaa, karna kemarin dan semua hari yang pernah kita lewati, kamu udah mewarnai hari hari aku. makasii karna kamu pernah hadir dengan cara yang mungkin sampai kapanpun bakal susah buat aku jelasin pake kata kata.

makasi karna kamu pernah jadi rumah yang paling tenang dan nyaman buat aku. tempat di mana aku bisa cerita, bercanda, ketawa, bahkan jadi anak kecil seutuhnya tanpa harus takut dianggap aneh.

semua rasa itu sebelumnya belum pernah aku rasain sama sekali, dan kamu adalah salah satu alasan kenapa aku akhirnya tau rasanya dicintai dengan cara yang begitu sederhana tapi berarti.`,
`sayangnya, mungkin emang kita harus sampai di sini.

persetan sama masa lalu dan segala hal yang akhirnya membawa kita ke titik ini. aku gamau lagi mencari siapa yang paling salah atau siapa yang paling bener.

aku cuma mau menghargai semua yang pernah kita punya, karna bagaimanapun juga, itu pernah menjadi bagian yang sangat berarti dalam hidup aku.

dan kalo boleh jujur, aku ngga pernah menyesal pernah mengenal kamu. bahkan setelah semua yang terjadi, aku tetep gamau menganggap semua yang kita lewati sebagai sesuatu yang sia sia.`,
`ada terlalu banyak hal baik yang pernah kamu kasih ke aku.

aku juga gamau kamu ngerasa harus bawa rasa bersalah itu terus terusan. kaloo emang ada hal yang salah dari kita, biarlah itu menjadi pelajaran buat kita masing masing.

aku udah memaafkan kamu, dan aku juga berharap kamu bisa memaafkan aku atas semua perkataan dan sikap aku yang mungkin pernah melukai kamu.

aku ga mauu kenangan tentang kita berubah menjadi sesuatu yang harus kamu benci.`,
`kaloo nanti suatu hari kamu inget aku, ngga apa apa kalo yang kamu inget cuma hal hal sederhana—tawa kita, cerita cerita kecil kita, atau bagaimana dulu kita pernah saling membuat hari masing masing terasa sedikit lebih ringan.

karna buat aku, kamu bukan sekedar seseorang yang pernah hadir lalu pergi. kamu adalah bagian dari sebuah masa yang pernah ngebuat aku bahagia.

dan meskipun akhirnya masa itu harus selesai, aku tetap bersyukur pernah menjalaninya bersama kamu.`,
`ke depannya, aku cuma mau kamu baik baik aja ya?.

jaga kesehatan kamu, jangan sering telat makan. jangan terlalu keras sama diri sendiri.

dan satu hal yang paling aku harap kamu inget, jangan pernah terlalu sering mengorbankan diri sendiri cuma demi menjaga perasaan orang lain.

kamu juga punya hati yang harus dijaga. kamu juga pantes didengarin. kamu juga pantaes ngerasa tenang.`,
`kamu adalah orang baik pertama yang pernah ngebuat aku ngerasa benar benar dicintai.

orang baik yang tanpa sadar bisa ngebuat aku jadi anak kecil seutuhnya, bisa ngebuat aku ngerasa aman hanya dengan keberadaan kamu.

dan mungkin kamu gapernah sadar seberapa besar arti hal hal kecil yang kamu lakukan buat aku.

aku ngga minta apa apa dari kamu setelah ini. aku cuma berharap kebahagiaan selalu menemukan jalan menuju kamu.`,
`semoga senyum kamu selalu punya alasan buat terus muncul.

semoga hari hari kamu setelah ini dipenuhi hal hal yang jauh lebih lembut daripada hari hari yang pernah kita lewati.

dan tolong, jangan pernah berhenti tersenyum. karna senyum kamu itu salah satu hal paling indah yang pernah aku liat.

senyum dan mata kamu pernah menjadi penenang paling murni buat diri aku.`,
`mungkin suatu hari nanti, senyum itu bukan lagi sesuatu yang bisa aku liat dari deket, tapi aku tetep berharap senyum itu ngga pernah pudar—bukan buat siapa siapa, tapi buat diri kamu sendiri.

kalau suatu hari nanti kamu ngeliat kembali semua yang pernah kita lewati, semoga yang tersisa bukan cuma tentang bagaimana semuanya berakhir.

semoga kamu juga bisa mengingat bahwa pernah ada seseorang yang bener bener bersyukur karna pernah dipertemukan sama kamu.`,
`aku ngga tau setelah malam ini hidup kita akan membawa kita ke mana.

tapi buat semua tawa, cerita, perhatian, rasa nyaman, dan hari hari yang pernah kamu warnai...

terimakasih.

terimakasih udah pernah jadi rumah yang bahkan gapernah aku tau ternyata selama ini aku cari.

jaga diri kamu baik baik, kyaa.

selamat malam.`,
{title:"satu hal yang ingin aku luruskan",chapter:"02 · sebuah kejelasan"},
`ada satu hal yang sampai sekarang mau aku lurusin, bukan karna aku mau membela diri atau mengubah apapun yang udah terjadi, tapi karna aku gamau kamu pergi menbawa pemahaman yang salah tentang aku.

aku gapernah gamon.

kaloo selama ini aku selalu berusaha nenangin kamu setiap kali kamu overthinking, setiap kali kamu takut, setiap kali kamu punya prasangka buruk tentang aku, itu bukan karna aku merasa terbebani, bukan karna aku terpaksa, dan bukan karna aku diem diem lelah menghadapi semua itu.

aku ngelakuin semuanya karna emang aku mau. murni karna aku sayang sama kamu.`,
`aku gapernah menghitung berapa kali aku harus meyakini kamu.

aku gapernah ngerasa, “kenapa lagi lagi aku harus nenangin dia?”

karna buat aku, kaloo perempuan yang aku sayang bisa tidur lebih tenang setelah aku meyakinkan dia, kalo pikiran kamu bisa sedikit lebih ringan setelah aku jelasin semuanya, itu udah lebih dari cukup buat aku.

aku cuma mau kamu hidup dengan tenang.

sesederhana itu...`,
`dan mungkin yang paling ngebuat aku sedih adalah waktu itu kamu ngga cerita semuanya ke aku.

aku sedih bukan karna kamu punya rasa takut, tapi karna aku berharap, kalo ada sesuatu yang ngebuat kamu ngga tenang, aku adalah orang pertama yang bisa kamu datangi.

aku lebih memilih mendengar ketakutan kamu secara langsung daripada mengetahui semuanya setelah keadaan udah sejauh itu.

tapi mau bagaimanapun, aku tetep ngga mau menjadikan itu alasan buat membenci kamu.`,
`aku cuma mau kamu tau satu hal dengan benar: aku gapernah kembali ke masa lalu.

sebelum aku dipertemukan sama kamu, ada banyak jalan yang udah aku lewati. ada banyak hal yang pernah ngebuat aku sedih, banyak hal yang pernah aku tahan, dan banyak hal yang perlahan udah aku lepaskan sampai akhirnya semuanya memudar dengan sendirinya.

masa lalu itu udah selesai jauh sebelum aku memilih buat berjalan mendekat ke kamu.`,
`jadi ketika aku pernah membicarakan tentang dia, bukan karna aku masih menyimpan sesuatu di dalam hati.

bukan karna aku masih berharap. bukan karna ada bagian dari diri aku yang mau kembali.

aku membicarakan dia karna ada seseorang yang terus mengganggu ketenangan kamu, dan aku gabisa diem ngeliat perempuan yang aku sayang terus ngerasa ngga tenang karna seseorang dari masa lalu aku.`,
`kalo waktu itu aku terdengar seperti sedang menjelek jelekkan dia, sebenarnya bukan dia sebagai seseorang yang sedang aku pikirkan.

aku cuma marah kepada bagian dari dirinya yang terus mengganggu kamu dan hubungan kita.

aku membela kamu, bukan mencari dia.

dan aku mau kamu percaya ini, meskipun mungkin sekarang semuanya udah terlambat buat dijelasin.`,
`aku ngga pernah berniat menaburi hubungan kita dengan masa lalu.

aku ngga pernah sengaja membawa nama dia ke dalam hubungan kita. aku ngga pernah mencari alasan buat membahas dia. aku ngga pernah menanyakan kabarnya karna rasa penasaran atau karna masih ada sesuatu yang tertinggal.

ngga ada dia di lubuk hati aku ketika aku memilih kamu.

yang ada waktu itu cuma kamu.`,
`perempuan yang aku pilih buat aku jaga.

perempuan yang setiap kali overthinking selalu aku coba tenangin.

perempuan yang aku yakinin berkali kali bahwa aku ada di sini dan bahwa kamu ngga perlu bersaing dengan masa lalu siapapun, karna buat aku, kamu bukan pengganti siapa siapa.

kamu adalah kamu.`,
`dan mungkin itu yang paling mau aku tinggalin sebagai kejelasan terakhir tentang perasaan aku.

kalau selama ini kamu pernah merasa harus bersaing dengan seseorang yang udah menjadi masa lalu, sebenarnya kamu ngga pernah perlu melakukan itu.

aku udah selesai dengan jalan yang dulu, dan ketika aku bertemu kamu, aku sedang berjalan di jalan yang baru.`,
`aku cuma sedih karna pada akhirnya, sesuatu yang sebenarnya sudah selesai di dalam diri aku justru menjadi alasan yang ngebuat kamu ngga tenang.

kalo ada satu hal yang aku harap bisa kamu percaya setelah semuanya selesai, percayalah bahwa selama aku bersama kamu, aku ngga lagi melihat ke belakang.

aku lagi melihat kamu.`,
`dan semua usaha aku buat menenangkan kamu, menjaga kamu, dan ngebuat kamu ngerasa aman selama ini bukanlah sebuah beban yang aku pikul.

itu adalah bentuk sayang yang emang mau aku kasih ke kamu.

aku ngga pernah lelah menyayangi kamu.

aku cuma akhirnya lelah ngeliat kita terus terluka oleh sesuatu yang sebenarnya udah lama aku tinggalin.`,
{cover:true,title:"selesai, tanpa menghapus arti",sub:"semoga setelah halaman terakhir ini, yang tersisa adalah ketenangan.",chapter:"03 · halaman terakhir"}
];

const book=document.getElementById("book");
let idx=0;
pages.forEach((p,i)=>{
  const el=document.createElement("section"); el.className="page"+(i===0?" active":"");
  if(typeof p==="object"){
    el.classList.add("cover");
    el.innerHTML=`<div><div class="chapter">${p.chapter}</div><h1>${p.title}</h1><div class="text">${p.sub}</div></div><div class="page-num">${String(i+1).padStart(2,"0")}</div>`;
  } else {
    const firstLine=p.trim().split("\n")[0];
    el.innerHTML=`<div><div class="chapter">${i<10?"01 · memory":"02 · honesty"}</div><div class="text"></div></div><div class="page-num">${String(i+1).padStart(2,"0")}</div>`;
    el.querySelector(".text").textContent=p.trim();
  }
  book.appendChild(el);
});
const els=[...document.querySelectorAll(".page")], counter=document.getElementById("counter");
function show(n){
  idx=Math.max(0,Math.min(els.length-1,n));
  els.forEach((e,i)=>e.classList.toggle("active",i===idx));
  counter.textContent=`${idx+1} / ${els.length}`;
  document.getElementById("hint").style.opacity=idx===0?".8":"0";
}
function next(){show(idx+1)} function prev(){show(idx-1)}
document.getElementById("next").onclick=next; document.getElementById("prev").onclick=prev;
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" ")next();if(e.key==="ArrowLeft")prev()});
document.addEventListener("click",e=>{
  if(e.target.closest("button"))return;
  if(e.clientX>innerWidth/2)next(); else prev();
});
let sx=0;
document.addEventListener("touchstart",e=>sx=e.changedTouches[0].screenX,{passive:true});
document.addEventListener("touchend",e=>{let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>45)dx<0?next():prev()},{passive:true});

const audio=document.getElementById("audio"), music=document.getElementById("music");
music.onclick=async()=>{
  try{await audio.play();music.textContent="♪ Musik menyala";}catch(err){music.textContent="♪ Coba nyalakan lagi";}
};
show(0);
</script>
</body>
</html>
